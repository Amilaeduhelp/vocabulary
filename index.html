<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My personal Vocabulary</title>
<link rel="icon" href="images/myicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Sinhala&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="pageStyle"></style>
<style>
  :root{
    --bg:#F5F1E6; --surface:#FFFFFF; --surface-soft:#FBF8EF;
    --ink:#202B1D; --muted:#707963; --line:#E4DEC9;
    --pine:#1E3B24; --pine-light:#33553B; --pine-soft:#E9EEE3;
    --gold:#B9812C; --gold-soft:#F2E2BB; --danger:#A53A3A;
    --radius:12px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans Sinhala','Segoe UI',Tahoma,sans-serif; line-height:1.55;
  }
  h1,h2,h3{ font-family:'Tiro Sinhala','Noto Serif Sinhala',Georgia,serif; font-weight:400; margin:0; }
  button{ font-family:inherit; cursor:pointer; }
  #printArea{ display:none; }

  /* ---------- top bar ---------- */
  .topbar{ background:var(--pine); color:#F4F1E4; padding:18px 28px; }
  .topbar-inner{ display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between; }
  .topbar h1{ font-size:clamp(22px,2.6vw,28px); }
  .topbar p{ margin:2px 0 0; color:#B9C6B2; font-size:13px; }
  .search{ position:relative; flex:1; min-width:240px; max-width:520px; }
  .search input{
    width:100%; padding:12px 14px 12px 40px; border-radius:9px;
    border:1px solid var(--pine-light); background:#173318; color:#F4F1E4;
    font-size:15px; font-family:inherit;
  }
  .search input::placeholder{ color:#AEBBA6; }
  .search input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .search svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:#AEBBA6; }
  .top-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .btn{
    border:1px solid var(--pine); background:var(--pine); color:#F4F1E4;
    padding:10px 16px; border-radius:9px; font-size:14px; font-weight:500;
  }
  .btn:hover{ background:var(--pine-light); }
  .btn.gold{ background:var(--gold); border-color:var(--gold); color:#fff; }
  .btn.gold:hover{ background:#a17124; }
  .btn.ghost{ background:transparent; color:#E2E8DA; border-color:var(--pine-light); }
  .btn.ghost:hover{ background:var(--pine-light); }
  .btn.light{ background:var(--surface); color:var(--pine); border-color:var(--line); }
  .btn.light:hover{ background:var(--pine-soft); }

  /* ---------- layout ---------- */
  .wrap{ padding:0 28px 60px; width:100%; }
  .strip{
    position:sticky; top:0; z-index:5; background:var(--bg);
    display:flex; flex-wrap:wrap; gap:5px; align-items:center;
    padding:14px 0 12px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .lt{
    min-width:32px; height:32px; border:1px solid var(--line); background:var(--surface);
    color:var(--pine); border-radius:8px; font-size:13.5px; font-weight:600;
  }
  .lt:hover:not(:disabled){ background:var(--gold-soft); border-color:var(--gold); }
  .lt:disabled{ color:#C3BDA6; background:transparent; border-style:dashed; cursor:default; }
  .status{ margin-left:auto; color:var(--muted); font-size:13px; padding-left:12px; }

  .letter{ margin-bottom:28px; scroll-margin-top:70px; }
  .letter > h2{
    font-size:26px; color:var(--pine); display:flex; align-items:center; gap:12px; margin-bottom:12px;
  }
  .letter > h2::after{ content:""; flex:1; height:1px; background:var(--line); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--pine);
    border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  .card-head{ display:flex; align-items:center; gap:8px; }
  .card h3{ font-size:24px; color:var(--pine); flex:1; overflow-wrap:anywhere; }
  .speak{
    border:1px solid var(--line); background:var(--surface-soft); border-radius:8px;
    width:34px; height:32px; font-size:15px;
  }
  .speak:hover{ background:var(--gold-soft); }
  .lbl{ font-size:11.5px; letter-spacing:.3px; color:var(--muted); font-weight:600; margin-bottom:2px; }
  .meaning{ font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .sinhala{
    background:var(--gold-soft); border-left:3px solid var(--gold); border-radius:6px;
    padding:8px 11px; font-size:14.5px; color:#4A3410; white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .sinhala .lbl{ color:#7A5A22; }
  .examples{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
  .examples li{
    font-size:14px; color:#39432F; padding:6px 10px; background:var(--surface-soft);
    border:1px solid var(--line); border-radius:8px; overflow-wrap:anywhere;
  }
  .card-foot{ margin-top:auto; padding-top:10px; border-top:1px dashed var(--line); display:flex; gap:6px; }
  .sbtn{
    border:1px solid var(--line); background:var(--surface-soft); color:var(--pine);
    padding:6px 12px; border-radius:8px; font-size:12.5px;
  }
  .sbtn:hover{ background:var(--pine-soft); }
  .sbtn.del:hover{ color:var(--danger); border-color:#E3B9B9; background:#FBEDED; }
  .empty{
    text-align:center; color:var(--muted); padding:60px 10px; border:1px dashed var(--line);
    border-radius:var(--radius); background:var(--surface-soft);
  }

  /* ---------- dialog ---------- */
  dialog{
    border:none; border-radius:14px; padding:0; width:min(640px, 94vw);
    box-shadow:0 20px 60px rgba(20,35,20,.35); background:var(--surface); color:var(--ink);
  }
  dialog::backdrop{ background:rgba(20,35,20,.45); }
  .dlg-head{ background:var(--pine); color:#F4F1E4; padding:16px 20px; }
  .dlg-head h2{ font-size:20px; }
  form.dlg{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px; }
  form.dlg label{ font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:5px; }
  form.dlg input, form.dlg textarea{
    padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:15px; color:var(--ink); background:var(--surface-soft);
  }
  form.dlg textarea{ resize:vertical; }
  form.dlg input:focus, form.dlg textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .dlg-actions{ display:flex; gap:8px; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
  .dlg-msg{ margin-right:auto; color:var(--pine-light); font-size:13px; }

  @media (max-width:640px){
    .wrap{ padding:0 14px 50px; }
    .topbar{ padding:14px; }
    .grid{ grid-template-columns:1fr; }
    .status{ margin-left:0; width:100%; padding-left:0; }
  }

  /* ---------- PRINT (PDF) layout, modelled on the plan ---------- */
  @media print{
    html, body{ background:#fff !important; }
    .app{ display:none !important; }
    #printArea{
      display:block; color:#000; font-family:'Times New Roman','Noto Serif Sinhala','Noto Sans Sinhala',serif;
      font-size:11pt; line-height:1.35; width:100%;
    }
    .p-letter{
      font-size:13pt; font-weight:700; margin:12pt 0 5pt; padding-bottom:2pt;
      border-bottom:0.6pt solid #999; break-after:avoid; page-break-after:avoid;
    }
    .p-entry{ break-inside:avoid; page-break-inside:avoid; margin-bottom:10pt; overflow-wrap:anywhere; word-break:break-word; }
    .p-word{ font-size:13pt; font-weight:700; }
    .p-line{ white-space:pre-wrap; }
    .p-sin{ font-family:'Noto Sans Sinhala','Iskoola Pota','Nirmala UI',sans-serif; font-size:10.5pt; }
    .p-ex{ margin:0 0 0 30pt; padding:0; list-style:none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>My personal Vocabulary</h1>
        <p>English–English ශබ්දකෝෂය · අවශ්‍ය තැන්වල සිංහල පැහැදිලි කිරීම් සමඟ</p>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="වචනයක්, අර්ථයක් හෝ උදාහරණයක් සොයන්න...">
      </div>
      <div class="top-actions">
        <button class="btn gold" id="addBtn">+ අලුත් වචනයක්</button>
        <button class="btn ghost" id="pdfBtn" title="Print window එකේ Destination = Save as PDF තෝරන්න">PDF</button>
        <button class="btn ghost" id="xlsBtn">Excel</button>
        <button class="btn ghost" id="backupBtn" title="සියලු දත්ත JSON ගොනුවකට save කරන්න">Backup</button>
        <button class="btn ghost" id="restoreBtn" title="Backup ගොනුවක් නැවත ගන්න">Restore</button>
        <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="strip" id="strip"></div>
    <div id="list"></div>
  </div>
</div>

<div id="printArea"></div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlgTitle">අලුත් වචනයක්</h2></div>
  <form class="dlg" id="form" method="dialog">
    <label>Word (වචනය)
      <input id="fWord" type="text" required maxlength="120" autocomplete="off" placeholder="e.g. Mother">
    </label>
    <label>Meaning (අර්ථය, ඉංග්‍රීසියෙන්)
      <textarea id="fMeaning" rows="3" required placeholder="a female parent of a child or animal"></textarea>
    </label>
    <label>Examples (එක් පේළියකට එක් උදාහරණයක්)
      <textarea id="fExamples" rows="4" placeholder="I want to buy a present for my mother.&#10;She's the mother of twins."></textarea>
    </label>
    <label>සිංහල පැහැදිලි කිරීම (අවශ්‍ය නම් පමණි)
      <textarea id="fSinhala" rows="2" placeholder="උදා: මව"></textarea>
    </label>
    <div class="dlg-actions">
      <span class="dlg-msg" id="dlgMsg"></span>
      <button type="button" class="btn light" id="cancelBtn">වසන්න</button>
      <button type="button" class="btn light" id="nextBtn">Save &amp; ඊළඟ වචනය</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<script>
/* ===== change these two lines to change the PDF header / footer text ===== */
const DOC_TITLE = 'My personal Vocabulary';
const OWNER     = 'Amila Udawattha';

const KEY = 'eduhelp_vocab_v1';
let entries = load();
let editingId = null;

const $ = id => document.getElementById(id);
const q = $('q'), dlg = $('dlg');
const fWord = $('fWord'), fMeaning = $('fMeaning'), fExamples = $('fExamples'), fSinhala = $('fSinhala');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function load(){
  try{ const a = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(entries)); }
  catch(e){ alert('Save කිරීමට නොහැකි විය (browser storage අවහිර වී ඇත).'); }
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ---------- alphabetical order ---------- */
function keyOf(w){ return w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function letterOf(w){
  const c = keyOf(w).charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : '#';
}
function sorted(){
  return entries.slice().sort((a,b)=>{
    const la = letterOf(a.word), lb = letterOf(b.word);
    if(la !== lb){ if(la === '#') return 1; if(lb === '#') return -1; return la < lb ? -1 : 1; }
    return keyOf(a.word).localeCompare(keyOf(b.word), 'en', {sensitivity:'base'});
  });
}

/* ---------- screen rendering ---------- */
function speak(w){
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); }
  catch(e){}
}

function card(e){
  const c = el('article','card');
  const head = el('div','card-head');
  head.appendChild(el('h3','',e.word));
  const sp = el('button','speak','🔊'); sp.title = 'උච්චාරණය අසන්න'; sp.onclick = ()=>speak(e.word);
  head.appendChild(sp);
  c.appendChild(head);

  const m = el('div');
  m.appendChild(el('div','lbl','MEANING'));
  m.appendChild(el('div','meaning',e.meaning));
  c.appendChild(m);

  if(e.sinhala){
    const s = el('div','sinhala');
    s.appendChild(el('div','lbl','සිංහලෙන්'));
    s.appendChild(document.createTextNode(e.sinhala));
    c.appendChild(s);
  }
  if(e.examples && e.examples.length){
    const x = el('div');
    x.appendChild(el('div','lbl','EXAMPLE (HOW TO USE)'));
    const ul = el('ul','examples');
    e.examples.forEach(t=>ul.appendChild(el('li','',t)));
    x.appendChild(ul);
    c.appendChild(x);
  }
  const foot = el('div','card-foot');
  const ed = el('button','sbtn','Edit'); ed.onclick = ()=>openDialog(e);
  const del = el('button','sbtn del','මකන්න');
  del.onclick = ()=>{ if(confirm(`“${e.word}” මකා දමන්නද?`)){ entries = entries.filter(x=>x.id !== e.id); persist(); render(); } };
  foot.appendChild(ed); foot.appendChild(del);
  c.appendChild(foot);
  return c;
}

function render(){
  const term = q.value.trim().toLowerCase();
  const shown = sorted().filter(e=>{
    if(!term) return true;
    return [e.word, e.meaning, e.sinhala || '', ...(e.examples || [])].join('\n').toLowerCase().includes(term);
  });

  const present = new Set(shown.map(e=>letterOf(e.word)));
  const strip = $('strip'); strip.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(L=>{
    const b = el('button','lt',L);
    b.disabled = !present.has(L);
    b.onclick = ()=>{ const t = document.getElementById('L-' + (L === '#' ? 'other' : L)); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); };
    strip.appendChild(b);
  });
  strip.appendChild(el('span','status', term ? `වචන ${shown.length}ක් හමුවිය` : `වචන ${entries.length}ක්`));

  const list = $('list'); list.innerHTML = '';
  if(!shown.length){
    list.appendChild(el('div','empty', entries.length ? 'ගැළපෙන වචනයක් හමු නොවීය.' : '“+ අලුත් වචනයක්” ඔබා පළමු වචනය ඇතුළත් කරන්න.'));
    return;
  }
  let cur = '', grid = null;
  shown.forEach(e=>{
    const L = letterOf(e.word);
    if(L !== cur){
      cur = L;
      const sec = el('section','letter'); sec.id = 'L-' + (L === '#' ? 'other' : L);
      sec.appendChild(el('h2','',L));
      grid = el('div','grid'); sec.appendChild(grid);
      list.appendChild(sec);
    }
    grid.appendChild(card(e));
  });
}

/* ---------- add / edit ---------- */
function openDialog(e){
  editingId = e ? e.id : null;
  $('dlgTitle').textContent = e ? 'වචනය සංස්කරණය' : 'අලුත් වචනයක්';
  $('nextBtn').style.display = e ? 'none' : '';
  $('dlgMsg').textContent = '';
  fWord.value = e ? e.word : '';
  fMeaning.value = e ? e.meaning : '';
  fExamples.value = e ? (e.examples || []).join('\n') : '';
  fSinhala.value = e ? (e.sinhala || '') : '';
  dlg.showModal();
  fWord.focus();
}

function commit(){
  const word = fWord.value.trim().replace(/\s+/g,' ');
  const meaning = fMeaning.value.trim();
  if(!word){ fWord.focus(); return false; }
  if(!meaning){ fMeaning.focus(); return false; }
  const dup = entries.find(x=>x.id !== editingId && x.word.toLowerCase() === word.toLowerCase());
  if(dup){
    $('dlgMsg').textContent = `“${dup.word}” දැනටමත් ඇත — එය Edit කරන්න.`;
    fWord.focus();
    return false;
  }
  const examples = fExamples.value.split('\n').map(s=>s.trim()).filter(Boolean);
  const sinhala = fSinhala.value.trim();
  if(editingId){
    const e = entries.find(x=>x.id === editingId);
    if(e){ e.word = word; e.meaning = meaning; e.examples = examples; e.sinhala = sinhala; }
  }else{
    entries.push({ id:newId(), word, meaning, examples, sinhala, created:Date.now() });
  }
  persist(); render();
  return true;
}

$('addBtn').onclick = ()=>openDialog(null);
$('cancelBtn').onclick = ()=>dlg.close();
$('form').addEventListener('submit', ev=>{ ev.preventDefault(); if(commit()) dlg.close(); });
$('nextBtn').onclick = ()=>{
  const w = fWord.value.trim();
  if(commit()){
    fWord.value = ''; fMeaning.value = ''; fExamples.value = ''; fSinhala.value = '';
    $('dlgMsg').textContent = `✓ “${w}” save විය`;
    fWord.focus();
  }
};
dlg.addEventListener('keydown', ev=>{
  if(ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); if(commit()) dlg.close(); }
});
q.addEventListener('input', render);
document.addEventListener('keydown', ev=>{
  const t = document.activeElement.tagName;
  if(ev.key === '/' && t !== 'INPUT' && t !== 'TEXTAREA'){ ev.preventDefault(); q.focus(); }
});

/* ---------- PDF: print layout (header, page no, footer on every page) ---------- */
document.getElementById('pageStyle').textContent =
  '@page{ size:A4; margin:22mm 16mm 20mm 16mm;' +
  ' @top-left{ content:' + JSON.stringify(DOC_TITLE) + '; font:10pt "Noto Sans Sinhala",Arial,sans-serif; border-bottom:0.6pt solid #888; vertical-align:bottom; padding-bottom:3pt; }' +
  ' @top-center{ content:""; border-bottom:0.6pt solid #888; }' +
  ' @top-right{ content:"Page " counter(page); font:10pt "Noto Sans Sinhala",Arial,sans-serif; border-bottom:0.6pt solid #888; vertical-align:bottom; padding-bottom:3pt; }' +
  ' @bottom-right{ content:' + JSON.stringify(OWNER) + '; font:10pt "Noto Sans Sinhala",Arial,sans-serif; border-top:0.6pt solid #888; vertical-align:top; padding-top:3pt; }' +
  ' @bottom-left{ content:""; border-top:0.6pt solid #888; }' +
  ' @bottom-center{ content:""; border-top:0.6pt solid #888; } }';

function buildPrint(){
  const pa = $('printArea'); pa.innerHTML = '';
  let cur = '';
  sorted().forEach(e=>{
    const L = letterOf(e.word);
    if(L !== cur){ cur = L; pa.appendChild(el('div','p-letter',L)); }
    const box = el('div','p-entry');
    box.appendChild(el('div','p-word',e.word));
    box.appendChild(el('div','p-line','Meaning-' + e.meaning));
    if(e.sinhala) box.appendChild(el('div','p-line p-sin','සිංහල-' + e.sinhala));
    if(e.examples && e.examples.length){
      box.appendChild(el('div','p-line','Example(How to use)'));
      const ul = el('ul','p-ex');
      e.examples.forEach(t=>ul.appendChild(el('li','',t)));
      box.appendChild(ul);
    }
    pa.appendChild(box);
  });
}

/* ---------- Excel: built in the browser, no internet / library needed ---------- */
const CRC_TABLE = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function makeZip(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), data = enc.encode(f.text);
    const crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,size,true); lh.setUint32(22,size,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,name.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((s,c)=>s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function xmlEsc(s){
  return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function cell(ref, text, style){
  return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(text) + '</t></is></c>';
}

function buildXlsx(list){
  const head = ['No.', 'Word', 'Meaning', 'Sinhala explanation', 'Examples'];
  const cols = 'ABCDE';
  let rows = '<row r="1" ht="24" customHeight="1">' + head.map((h,i)=>cell(cols[i] + '1', h, 1)).join('') + '</row>';
  list.forEach((e,i)=>{
    const r = i + 2;
    const vals = [String(i + 1), e.word, e.meaning, e.sinhala || '', (e.examples || []).join('\n')];
    rows += '<row r="' + r + '">' + vals.map((v,c)=>cell(cols[c] + r, v, 2)).join('') + '</row>';
  });
  const last = list.length + 1;
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="' + NS + '">' +
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
    '<cols><col min="1" max="1" width="6" customWidth="1"/><col min="2" max="2" width="22" customWidth="1"/>' +
    '<col min="3" max="3" width="55" customWidth="1"/><col min="4" max="4" width="40" customWidth="1"/><col min="5" max="5" width="60" customWidth="1"/></cols>' +
    '<sheetData>' + rows + '</sheetData><autoFilter ref="A1:E' + last + '"/></worksheet>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="' + NS + '">' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF1E3B24"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const REL = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const OD = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  return makeZip([
    { name:'[Content_Types].xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
    { name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + REL + '"><Relationship Id="rId1" Type="' + OD + '/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name:'xl/workbook.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + NS + '" xmlns:r="' + OD + '"><sheets><sheet name="Vocabulary" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name:'xl/_rels/workbook.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + REL + '"><Relationship Id="rId1" Type="' + OD + '/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + OD + '/styles" Target="styles.xml"/></Relationships>' },
    { name:'xl/styles.xml', text:styles },
    { name:'xl/worksheets/sheet1.xml', text:sheet }
  ]);
}
/* XLSX-END */

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
$('xlsBtn').onclick = ()=>{
  if(!entries.length){ alert('Export කිරීමට වචන කිසිවක් නැත.'); return; }
  download(buildXlsx(sorted()), 'My-personal-Vocabulary-' + today() + '.xlsx');
};

/* ---------- backup / restore ---------- */
$('backupBtn').onclick = ()=>{
  download(new Blob([JSON.stringify({entries}, null, 2)], {type:'application/json'}), 'vocabulary-backup-' + today() + '.json');
};
$('restoreBtn').onclick = ()=>$('restoreFile').click();
$('restoreFile').onchange = ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      const incoming = Array.isArray(data) ? data : (data.entries || []);
      const have = new Set(entries.map(x=>x.word.toLowerCase()));
      let added = 0;
      incoming.forEach(x=>{
        if(x && x.word && x.meaning && !have.has(String(x.word).toLowerCase())){
          entries.push({ id:x.id || newId(), word:String(x.word), meaning:String(x.meaning),
            examples:Array.isArray(x.examples) ? x.examples.map(String) : [], sinhala:x.sinhala ? String(x.sinhala) : '', created:x.created || Date.now() });
          have.add(String(x.word).toLowerCase()); added++;
        }
      });
      persist(); render();
      alert(`වචන ${added}ක් අලුතින් එකතු කළා.`);
    }catch(err){ alert('මේ ගොනුව කියවීමට නොහැකි විය.'); }
    ev.target.value = '';
  };
  r.readAsText(f);
};

render();
